<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Adebayo Celestina | ASAKE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-one: #fff4f7;
      --bg-two: #f3edff;
      --bg-three: #e8f3ff;

      --card: rgba(255, 255, 255, 0.72);
      --text: #211a2d;
      --muted: #766d80;

      --pink: #d94f8a;
      --purple: #7954c7;
      --blue: #4f7bd9;

      --border: rgba(255, 255, 255, 0.75);
      --shadow: rgba(75, 51, 98, 0.14);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      color: var(--text);

      background:
        radial-gradient(circle at 10% 15%, #ffdce8 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, #e7dcff 0%, transparent 38%),
        radial-gradient(circle at 80% 90%, #d8ebff 0%, transparent 35%),
        linear-gradient(
          135deg,
          var(--bg-one),
          var(--bg-two),
          var(--bg-three)
        );

      overflow: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(4px);
      opacity: 0.55;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }

    .blob.one {
      width: 180px;
      height: 180px;
      background: #f7a7c7;
      top: -50px;
      left: -40px;
    }

    .blob.two {
      width: 240px;
      height: 240px;
      background: #bca8f5;
      bottom: -100px;
      right: -70px;
      animation-delay: 1.5s;
    }

    .blob.three {
      width: 130px;
      height: 130px;
      background: #9cc6f4;
      top: 14%;
      right: 5%;
      animation-delay: 3s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-18px) translateX(8px);
      }
    }

    main {
      width: 100%;
      max-width: 820px;
      position: relative;
      z-index: 1;
    }

    .card {
      position: relative;
      overflow: hidden;

      padding: 38px 26px 28px;

      border: 1px solid var(--border);
      border-radius: 32px;

      background: var(--card);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 30px 80px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        rgba(217, 79, 138, 0.16),
        rgba(121, 84, 199, 0.1)
      );

      top: -120px;
      right: -80px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 42px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 9px 14px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(121, 84, 199, 0.12);

      color: var(--purple);

      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .heart {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        rgba(217, 79, 138, 0.15),
        rgba(121, 84, 199, 0.12)
      );

      font-size: 1.15rem;
    }

    .eyebrow {
      color: var(--pink);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      max-width: 650px;

      font-size: clamp(3rem, 10vw, 6.4rem);
      line-height: 0.92;
      letter-spacing: -0.075em;

      margin-bottom: 18px;
    }

    h1 span {
      display: block;

      background: linear-gradient(
        90deg,
        var(--pink),
        var(--purple),
        var(--blue)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nickname {
      color: var(--muted);

      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 600;

      margin-bottom: 40px;
    }

    .message-box {
      position: relative;

      padding: 26px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.86),
          rgba(255, 255, 255, 0.54)
        );

      border: 1px solid rgba(255, 255, 255, 0.9);

      margin-bottom: 34px;
    }

    .quote-mark {
      font-family: Georgia, serif;
      font-size: 3.2rem;
      line-height: 1;

      color: rgba(217, 79, 138, 0.22);

      position: absolute;
      top: 10px;
      left: 18px;
    }

    .message {
      position: relative;
      z-index: 1;

      font-size: clamp(1.18rem, 4.5vw, 1.75rem);
      line-height: 1.5;
      letter-spacing: -0.025em;

      padding-top: 16px;
    }

    .message strong {
      background: linear-gradient(
        90deg,
        var(--pink),
        var(--purple)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;

      gap: 14px;

      padding-top: 20px;
      border-top: 1px solid rgba(33, 26, 45, 0.08);

      color: var(--muted);

      font-size: 0.88rem;
    }

    .date {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;

      background: linear-gradient(
        135deg,
        var(--pink),
        var(--purple)
      );

      box-shadow: 0 0 0 5px rgba(217, 79, 138, 0.08);
    }

    .signature {
      font-weight: 700;
      color: #574b63;
    }

    @media (min-width: 700px) {
      .card {
        padding: 54px 54px 36px;
      }

      .message-box {
        padding: 32px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        border-radius: 26px;
      }

      .top-row {
        margin-bottom: 34px;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main>
    <section class="card">

      <div class="top-row">
        <div class="badge">
          ✦ Made with love
        </div>

        <div class="heart">♥</div>
      </div>

      <p class="eyebrow">For someone special</p>

      <h1>
        Adebayo
        <span>Celestina.</span>
      </h1>

      <p class="nickname">ASAKE</p>

      <div class="message-box">
        <div class="quote-mark">“</div>

        <p class="message">
          Well done. You are so
          <strong>diligent in all you do</strong>,
          and I love you so much.
        </p>
      </div>

      <footer>
        <div class="date">
          <span class="date-dot"></span>
          <span id="today"></span>
        </div>

        <span class="signature">For Asake ♥</span>
      </footer>

    </section>
  </main>

  <script>
    const today = new Date();

    const formattedDate = new Intl.DateTimeFormat("en-IE", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(today);

    document.getElementById("today").textContent = formattedDate;
  </script>

</body>
</html>
